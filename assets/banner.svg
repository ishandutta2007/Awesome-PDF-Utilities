<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMovement {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes beaconRing {
        0% { r: 6px; opacity: 0.9; }
        100% { r: 24px; opacity: 0; }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; transform-origin: center; }
      .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; transform-origin: center; }
      .floating-pill-3 { animation: floatSlow3 6.5s ease-in-out infinite; transform-origin: center; }
      .pulsing-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 6, 8; animation: dashMovement 12s linear infinite; }
      .beacon { animation: beaconRing 2.4s ease-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="960" height="280" rx="16" fill="url(#grid)"/>

  <!-- Outer Gradient Border Line -->
  <rect x="1.5" y="1.5" width="957" height="277" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ambient Pulsing Glow Orbs (Background layer) -->
  <circle cx="180" cy="80" r="130" fill="url(#accentGlow)" filter="url(#glowEffect)" class="pulsing-orb"/>
  <circle cx="800" cy="200" r="150" fill="url(#accentGlow)" filter="url(#glowEffect)" class="pulsing-orb" style="animation-delay: -3s;"/>
  <circle cx="480" cy="140" r="100" fill="#6366f1" fill-opacity="0.12" filter="url(#glowEffect)" class="pulsing-orb" style="animation-delay: -1.5s;"/>

  <!-- Dynamic Animated Flow Vectors (Background layer) -->
  <path d="M 60 140 Q 240 60 480 140 T 900 140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="animated-dash"/>
  <path d="M 90 200 Q 320 250 560 190 T 920 180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" class="animated-dash" style="animation-duration: 9s; stroke-dasharray: 5, 10;"/>

  <!-- Dynamic Tech Pills (Floating in midground - positioned around edges so title remains 100% visible) -->
  <!-- Top Left Pill: Merge & Split -->
  <g class="floating-pill-1" style="transform-origin: 100px 50px;">
    <g filter="url(#pillShadow)">
      <rect x="42" y="38" width="132" height="30" rx="15" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="58" cy="53" r="4.5" fill="#38bdf8"/>
      <text x="70" y="58" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4">Merge &amp; Split</text>
    </g>
  </g>

  <!-- Top Right Pill: Self-Hosted -->
  <g class="floating-pill-2" style="transform-origin: 850px 50px;">
    <g filter="url(#pillShadow)">
      <rect x="785" y="38" width="135" height="30" rx="15" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="801" cy="53" r="4.5" fill="#818cf8"/>
      <text x="813" y="58" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4">Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Left Pill: Privacy-First WASM -->
  <g class="floating-pill-3" style="transform-origin: 120px 230px;">
    <g filter="url(#pillShadow)">
      <rect x="42" y="214" width="168" height="30" rx="15" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="58" cy="229" r="4.5" fill="#34d399"/>
      <text x="70" y="234" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">Browser-Side WASM</text>
    </g>
  </g>

  <!-- Bottom Right Pill: OCR & Convert -->
  <g class="floating-pill-1" style="transform-origin: 840px 230px; animation-delay: -2s;">
    <g filter="url(#pillShadow)">
      <rect x="778" y="214" width="142" height="30" rx="15" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="794" cy="229" r="4.5" fill="#f472b6"/>
      <text x="806" y="234" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">OCR &amp; Compress</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Main Text and Branding (Strictly on top, completely unobstructed) -->
  <g id="foregroundContent">
    <!-- Category Mini-Badge -->
    <rect x="365" y="44" width="230" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="380" cy="57" r="4" fill="#6366f1"/>
    <circle cx="380" cy="57" r="4" fill="none" stroke="#818cf8" stroke-width="1.5" class="beacon"/>
    <text x="393" y="61" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE</text>

    <!-- Main Title -->
    <text x="480" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.6))">
      Awesome PDF Utilities
    </text>

    <!-- Subtitle Line 1 -->
    <text x="480" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#f1f5f9" letter-spacing="0.2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.8))">
      High-Performance Tools, Self-Hosted Engines, WebAssembly &amp; Document Automation
    </text>

    <!-- Subtitle Line 2: Value Proposition & Scope -->
    <text x="480" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="url(#subTextGrad)" letter-spacing="0.3">
      Zero Cloud Leakage • Command-Line Power • Enterprise SaaS • Scanned OCR Pipelines
    </text>
  </g>
</svg>
